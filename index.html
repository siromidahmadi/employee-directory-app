<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Directory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="directory-header">
        <p class="header-label">EMPLOYEE DIRECTORY</p>
        <h1>Meet Our Team</h1>
        <p class="header-description">Find people, departments, and contact information across our organization.</p>
    </header>

    <div class="search-container">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input type="text" id="search" placeholder="Search employees..." aria-label="Search employees">
    </div>

    <p id = "results-count" aria-live="polite"></p>
    <div id="employee-list" class="employee-grid">
        <!-- Employee information will appear here -->
    </div>

    <footer>
        <p>Employee Directory App © 2026</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
